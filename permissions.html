<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>権限管理 - ライナーズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --paper: #F6F2E9; --paper-dark: #ECE5D4;
        --wood: #6B4A34; --wood-dark: #4E3626;
        --grass: #2F4A34; --magnet: #4A90A4; --magnet-dark: #366B7B;
        --ink: #2A2420; --ink-soft: #6B6154; --brick: #B5482F; --line: #DCD3BE;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background: var(--paper); color: var(--ink); padding-bottom: 40px; -webkit-font-smoothing: antialiased; }

    header { background: var(--wood-dark); color: var(--paper); padding: 16px 18px; display: flex; align-items: center; gap: 10px; }
    header a { color: var(--paper); text-decoration: none; font-size: 1.1rem; }
    header .title { font-size: 1.05rem; font-weight: 900; }

    main { max-width: 480px; margin: 0 auto; padding: 16px; }

    .notice-box { background: #FFF3D6; border: 1.5px solid #D4A017; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 0.78rem; line-height: 1.6; }

    .login-panel { background: white; border-radius: 14px; padding: 24px 20px; margin-top: 20px; }
    .login-panel h2 { font-size: 1rem; margin-bottom: 16px; }
    .form-field { margin-bottom: 12px; }
    .form-field label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
    .form-field input, .form-field select {
        width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px;
        font-size: 0.85rem; font-family: 'Noto Sans JP', sans-serif;
    }
    .primary-btn {
        width: 100%; border: none; background: var(--wood); color: white; font-weight: 700;
        font-size: 0.88rem; padding: 12px; border-radius: 10px; cursor: pointer; margin-top: 4px;
    }
    .error-msg { color: var(--brick); font-size: 0.75rem; margin-top: 8px; }
    .user-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--ink-soft); margin-bottom: 14px; }
    .logout-link { color: var(--magnet-dark); text-decoration: underline; cursor: pointer; background: none; border: none; font-size: 0.72rem; font-family: 'Noto Sans JP', sans-serif; }

    .add-panel { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .add-panel h3 { font-size: 0.85rem; margin-bottom: 10px; }

    .role-card { background: white; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
    .role-card .email { font-size: 0.82rem; font-weight: 700; }
    .role-card .role-badge { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }
    .role-badge.coach { background: var(--brick); color: white; }
    .role-badge.parent { background: var(--magnet); color: white; }
    .role-card .linked-player { font-size: 0.72rem; color: var(--ink-soft); margin-top: 4px; }
    .role-card .row1 { display: flex; justify-content: space-between; align-items: flex-start; }
    .edit-link { font-size: 0.72rem; color: var(--magnet-dark); text-decoration: underline; cursor: pointer; background: none; border: none; }

    .edit-form { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .edit-form select, .edit-form input {
        width: 100%; border: 1.5px solid var(--line); border-radius: 6px; padding: 7px;
        font-size: 0.78rem; margin-bottom: 6px; font-family: 'Noto Sans JP', sans-serif;
    }
    .edit-form-actions { display: flex; gap: 6px; margin-top: 6px; }
    .edit-form-actions button {
        flex: 1; border: none; padding: 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
    }
    .save-btn2 { background: var(--grass); color: white; }
    .delete-btn { background: var(--brick); color: white; }
    .cancel-btn2 { background: var(--paper-dark); color: var(--ink-soft); }

    .empty-note { text-align: center; color: var(--ink-soft); font-size: 0.82rem; padding: 30px 0; }
    .hidden { display: none !important; }
</style>
</head>
<body>

<header>
    <a href="index.html">←</a>
    <div class="title">🔑 権限管理</div>
</header>

<main>
    <div id="loginArea">
        <div class="login-panel">
            <h2>ログインしてください</h2>
            <div class="form-field"><label>メールアドレス</label><input id="loginEmail" type="email"></div>
            <div class="form-field"><label>パスワード</label><input id="loginPassword" type="password"></div>
            <button class="primary-btn" id="loginBtn">ログイン</button>
            <div class="error-msg hidden" id="loginError"></div>
        </div>
    </div>

    <div id="mainArea" class="hidden">
        <div class="user-bar">
            <span id="currentUserEmail"></span>
            <button class="logout-link" id="logoutBtn">ログアウト</button>
        </div>

        <div class="notice-box">
            ここで設定した内容は、成長記録(自分の子以外の記録を保護者が触れないようにする等)に反映されます。指導者の方が、指導者・保護者それぞれのメールアドレスに役割を割り当ててください。
        </div>

        <div class="add-panel">
            <h3>役割を追加・変更する</h3>
            <div class="form-field"><label>メールアドレス</label><input id="targetEmail" type="email" placeholder="対象の人のメールアドレス"></div>
            <div class="form-field"><label>役割</label>
                <select id="targetRole">
                    <option value="coach">指導者（全ての機能が使えます）</option>
                    <option value="parent">保護者（自分の子の成長記録だけ入力できます）</option>
                </select>
            </div>
            <div class="form-field" id="linkedPlayerWrap"><label>担当の選手（保護者の場合）</label><select id="targetLinkedPlayer"></select></div>
            <button class="primary-btn" id="saveRoleBtn">この内容で保存する</button>
        </div>

        <div id="roleList"></div>
        <div class="empty-note hidden" id="emptyNote">まだ役割が登録されていません。</div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
        getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import {
        getFirestore, collection, getDocs, doc, setDoc, deleteDoc,
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAnZ_Iif_iHbE-jmrc-XcCS0tLeUADPhqo",
        authDomain: "liners-db85c.firebaseapp.com",
        projectId: "liners-db85c",
        storageBucket: "liners-db85c.firebasestorage.app",
        messagingSenderId: "229305968070",
        appId: "1:229305968070:web:bbca2e6fa562e6ff9b3ec7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    // メールアドレスは、大文字小文字の違いで別人扱いにならないよう、小文字に統一して保存する
    function normalizeEmail(email) {
        return email.trim().toLowerCase();
    }

    let players = [];
    let roles = [];

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorEl = document.getElementById('loginError');
        errorEl.classList.add('hidden');
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (e) {
            errorEl.textContent = 'ログインできませんでした。メールアドレスとパスワードをご確認ください。';
            errorEl.classList.remove('hidden');
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('loginArea').classList.add('hidden');
            document.getElementById('mainArea').classList.remove('hidden');
            document.getElementById('currentUserEmail').textContent = user.email;
            await loadPlayers();
            await loadRoles();
        } else {
            document.getElementById('loginArea').classList.remove('hidden');
            document.getElementById('mainArea').classList.add('hidden');
        }
    });

    async function loadPlayers() {
        try {
            const snap = await getDocs(collection(db, 'players'));
            players = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            players.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ja'));

            const sel = document.getElementById('targetLinkedPlayer');
            sel.innerHTML = players.map((p) => '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>').join('');
        } catch (e) {
            players = [];
        }
    }

    document.getElementById('targetRole').addEventListener('change', (e) => {
        document.getElementById('linkedPlayerWrap').classList.toggle('hidden', e.target.value !== 'parent');
    });
    document.getElementById('linkedPlayerWrap').classList.add('hidden'); // 初期状態は「指導者」なので隠しておく

    async function loadRoles() {
        try {
            const snap = await getDocs(collection(db, 'userRoles'));
            roles = snap.docs.map((d) => ({ emailId: d.id, ...d.data() }));
            roles.sort((a, b) => a.emailId.localeCompare(b.emailId));
            renderRoleList();
        } catch (e) {
            document.getElementById('roleList').innerHTML = '<div class="empty-note">読み込めませんでした。</div>';
        }
    }

    function playerNameById(id) {
        const p = players.find((pl) => pl.id === id);
        return p ? p.name : '(削除済みの選手)';
    }

    function renderRoleList() {
        const listEl = document.getElementById('roleList');
        const emptyNote = document.getElementById('emptyNote');

        if (roles.length === 0) {
            listEl.innerHTML = '';
            emptyNote.classList.remove('hidden');
            return;
        }
        emptyNote.classList.add('hidden');

        listEl.innerHTML = roles.map((r) =>
            '<div class="role-card">' +
                '<div class="row1">' +
                    '<div>' +
                        '<div class="email">' + escapeHtml(r.emailId) + '</div>' +
                        '<span class="role-badge ' + r.role + '">' + (r.role === 'coach' ? '指導者' : '保護者') + '</span>' +
                        (r.role === 'parent' && r.linkedPlayerId ? '<div class="linked-player">担当：' + escapeHtml(playerNameById(r.linkedPlayerId)) + '</div>' : '') +
                    '</div>' +
                    '<button class="edit-link" data-delete-email="' + r.emailId + '">削除</button>' +
                '</div>' +
            '</div>'
        ).join('');

        listEl.querySelectorAll('[data-delete-email]').forEach((btn) => {
            btn.addEventListener('click', async () => {
                const ok = confirm(btn.dataset.deleteEmail + ' の役割設定を削除します。よろしいですか？');
                if (!ok) return;
                try {
                    await deleteDoc(doc(db, 'userRoles', btn.dataset.deleteEmail));
                    await loadRoles();
                } catch (e) {
                    alert('削除できませんでした。\n\nエラー内容：' + e.message);
                }
            });
        });
    }

    document.getElementById('saveRoleBtn').addEventListener('click', async () => {
        const email = document.getElementById('targetEmail').value.trim();
        if (!email) { alert('メールアドレスを入力してください'); return; }

        const emailId = normalizeEmail(email);
        const role = document.getElementById('targetRole').value;
        const linkedPlayerId = role === 'parent' ? document.getElementById('targetLinkedPlayer').value : null;

        try {
            await setDoc(doc(db, 'userRoles', emailId), {
                role,
                linkedPlayerId: linkedPlayerId || null,
            });
            document.getElementById('targetEmail').value = '';
            alert('保存しました。');
            await loadRoles();
        } catch (e) {
            alert('保存できませんでした。\n\nエラー内容：' + e.message);
        }
    });
</script>

</body>
</html>
